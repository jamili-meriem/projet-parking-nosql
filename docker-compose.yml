services:
  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: [mongo_data:/data/db]
    networks: [parking_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    networks: [parking_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  cassandra:
    image: cassandra:4.1
    ports: ["${CASSANDRA_PORT:-9042}:9042"]
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
      - CASSANDRA_CLUSTER_NAME=parking_cluster
    volumes: [cassandra_data:/var/lib/cassandra]
    networks: [parking_net]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  parking_net:

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
